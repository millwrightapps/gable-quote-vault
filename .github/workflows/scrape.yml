name: Pull Podcast Transcripts

on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday at midnight UTC
  workflow_dispatch:     # Allows manual trigger via the Actions tab

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Grants permission to push new files back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp youtube-transcript-api

      - name: Run Scraper Script
        # Point to the renamed script
        run: python scripts/discover_podscripts.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the folder where the script outputs files
          git add inbox/
          
          if ! git diff --staged --quiet; then
            git commit -m "Automated update: New podcast transcripts [skip ci]"
            git push
          else
            echo "No new transcripts to commit."
          fi
