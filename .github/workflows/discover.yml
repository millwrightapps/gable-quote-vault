name: Discover episodes
on:
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/discover_episodes.py
      - run: python3 scripts/collect_podscripts.py
      - run: python3 scripts/build_catalog.py --check
      - name: Save discovery queue and draft candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inbox/episodes.json inbox/podscripts_processed.json drafts/podscripts_*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update episode discovery and quote candidates'
          git push origin HEAD:main
